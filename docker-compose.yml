services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Self-hosted media server (spec 6.1). Publish/read authorised by the API; placeholder feeds via ffmpeg.
  mediamtx:
    image: bluenviron/mediamtx:1.9.1-ffmpeg
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # S3-compatible object storage for recordings / VOD (MinIO replacement agreed with the organizers on Day 1).
  objectstore:
    image: chrislusf/seaweedfs:3.73
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=256", "-volume.max=8"]
    volumes:
      - objectstore:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # Self-hosted push notifications for the mobile app (no Firebase / BaaS).
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8090
      NTFY_LISTEN_HTTP: ":80"
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: postgres://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379
      MEDIA_API_URL: http://mediamtx:9997
      S3_ENDPOINT: http://objectstore:8333
      NTFY_URL: http://ntfy:80
      PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      default:
        # spec 6.2.1: browser nodes reach the backend as http://backend:8080
        aliases: [backend]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ---- Selenium Grid 4 (spec 6.2.1) ----
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Each node runs a loopback relay first, so http://localhost:8080 inside the browser is the real API
  # (spec Test 1 navigates to http://localhost:8080/q/m1-live from within the Grid).
  node-chrome-1:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    command: ["bash", "-c", "python3 /opt/nascon/localhost_forward.py & exec /opt/bin/entry_point.sh"]
    volumes:
      - ./infra/selenium/localhost_forward.py:/opt/nascon/localhost_forward.py:ro
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck: &node-health
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5555/status >/dev/null && curl -sf http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  node-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    command: ["bash", "-c", "python3 /opt/nascon/localhost_forward.py & exec /opt/bin/entry_point.sh"]
    volumes:
      - ./infra/selenium/localhost_forward.py:/opt/nascon/localhost_forward.py:ro
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck: *node-health

  node-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    command: ["bash", "-c", "python3 /opt/nascon/localhost_forward.py & exec /opt/bin/entry_point.sh"]
    volumes:
      - ./infra/selenium/localhost_forward.py:/opt/nascon/localhost_forward.py:ro
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    healthcheck: *node-health

volumes:
  objectstore:
