services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgres://nascon:nascon@db:5432/nascon
      PORT: "8080"
      # Mock gateway unless PAYMENT_PROVIDER=stripe. Secrets come from .env, never from this file.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
